# Fabrique automatiquement l'appli Android à chaque modification du code.
# Le fichier d'installation (APK) est publié dans « Releases » du dépôt :
# https://github.com/fguyet-6cie/mufasa/releases/latest
name: Appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Préparer
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze

      - name: Tests automatiques
        run: flutter test

      - name: Fabriquer l'APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mufasa.apk
          gh release create "v0.2.${{ github.run_number }}" mufasa.apk \
            --title "Mufasa 0.2 (version ${{ github.run_number }})" \
            --notes "Fabriquée automatiquement depuis le commit ${{ github.sha }}. Sur le téléphone Android : télécharger mufasa.apk puis l'ouvrir pour l'installer."
